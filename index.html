<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Grupos: Ecología Agronómica</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; }
        .control-panel { background: #e0e0e0; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        canvas { background: #fff; border: 1px solid #aaa; display: block; margin: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>Análisis Comparativo: Grupos 1 al 7</h1>
    <div class="control-panel">
        <label>Grupo de Trabajo:</label>
        <select id="grupo" onchange="actualizarEscenario()">
            <option value="1">Grupo 1: Gradiente Altitudinal</option>
            <option value="2">Grupo 2: Estrés Hídrico (Sequía)</option>
            <option value="3">Grupo 3: Disponibilidad de Nutrientes</option>
            <option value="4">Grupo 4: Intensidad Lumínica</option>
            <option value="5">Grupo 5: Variación Térmica</option>
            <option value="6">Grupo 6: Salinidad del Suelo</option>
            <option value="7">Grupo 7: pH del Suelo</option>
        </select>
        <p><small id="mision">Seleccione un grupo para ver su misión.</small></p>
        <label>Modificar Intensidad del Factor Ambiental:</label>
        <input type="range" id="factorInput" min="0" max="100" value="50" oninput="dibujar()">
    </div>
    <canvas id="grafico" width="800" height="300"></canvas>
    <p><i>Nota: La curva estrecha (roja) es Polylepis. La curva ancha (verde) es Pinus.</i></p>
</div>

<script>
    const misiones = {
        "1": "Analicen la supervivencia de Polylepis en la cumbre vs. Pinus en el valle.",
        "2": "Simulen una sequía prolongada: ¿Cuándo el Polylepis pierde su viabilidad?",
        "3": "Evalúen la respuesta ante suelos pobres (baja fertilidad).",
        "4": "Comparen la eficiencia fotosintética según la insolación.",
        "5": "Analicen el límite de tolerancia térmica (Shelford).",
        "6": "Evalúen el efecto del aumento de sales sobre las raíces.",
        "7": "Simulen el efecto del pH en la disponibilidad de nutrientes."
    };

    function actualizarEscenario() {
        const g = document.getElementById("grupo").value;
        document.getElementById("mision").innerText = "Misión: " + misiones[g];
        dibujar();
    }

    function dibujar() {
        const canvas = document.getElementById('grafico');
        const ctx = canvas.getContext('2d');
        const val = parseInt(document.getElementById('factorInput').value);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Curva Eurioica (Pino) - Siempre presente, rango ancho
        ctx.strokeStyle = "green"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(50, 250);
        ctx.bezierCurveTo(200, 50, 600, 50, 750, 250); ctx.stroke();

        // Curva Estenoica (Polylepis) - Se desplaza según el control (Input)
        ctx.strokeStyle = "red";
        ctx.beginPath();
        let offset = val * 6; // El input desplaza la curva
        ctx.moveTo(offset, 250);
        ctx.bezierCurveTo(offset + 50, 50, offset + 150, 50, offset + 200, 250);
        ctx.stroke();

        ctx.fillStyle = "black";
        ctx.fillText("Valencia Ecológica (Respuesta del grupo " + document.getElementById("grupo").value + ")", 10, 20);
    }
    window.onload = actualizarEscenario;
</script>
</body>
</html>
